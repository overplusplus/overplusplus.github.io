        <script src="../static/js/mathjax-config.js" defer></script>
        <script type="text/javascript" id="MathJax-script" defer
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
        </script>

        <script>
            $(document).ready(function() {
                var options = {
                    slidesToScroll: 1,
                    slidesToShow: 1,
                    loop: true,
                    infinite: true,
                    autoplay: true,
                    autoplaySpeed: 3000,
                }

                // Initialize all div with carousel class
                var carousels = bulmaCarousel.attach('.carousel', options);

                // Loop on each carousel initialized
                for(var i = 0; i < carousels.length; i++) {
                    // Add listener to  event
                    carousels[i].on('before:show', state => {
                        console.log(state);
                    });
                }
            })
        </script>
        <!-- Apply default attributes to all videos -->
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                // Get all video elements on the page
                const videos = document.querySelectorAll('video');
                
                // Apply default attributes to each video
                videos.forEach(video => {
                    video.setAttribute('controls', '');
                    video.setAttribute('muted', '');
                    video.setAttribute('autoplay', '');
                    video.setAttribute('loop', '');
                    video.setAttribute('playsinline', '');
                });
            });
        </script>
        <link rel="stylesheet" href="../static/css/styles.css">
        
        <!-- TOC Widget Styles -->
        <style>
            .toc-widget {
                position: fixed;
                top: 20px;
                right: 20px;
                background: white;
                border: 1px solid #ddd;
                border-radius: 8px;
                padding: 15px 20px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                z-index: 1000;
                max-width: 280px;
            }
            
            .toc-widget h4 {
                margin: 0 0 12px 0;
                font-size: 16px;
                font-weight: bold;
                border-bottom: 2px solid #4488ff;
                padding-bottom: 8px;
            }
            
            .toc-widget ul {
                list-style: none;
                padding: 0;
                margin: 0;
            }
            
            .toc-widget li {
                margin: 8px 0;
            }
            
            .toc-widget a {
                color: #4488ff;
                text-decoration: none;
                font-size: 14px;
                display: block;
                padding: 4px 8px;
                border-radius: 4px;
                transition: all 0.2s;
            }
            
            .toc-widget a:hover {
                background: #f0f8ff;
                color: #ff0000;
                padding-left: 12px;
            }
            
            @media (max-width: 768px) {
                .toc-widget {
                    display: none;
                }
            }
        </style>
        
        <!-- Smooth scroll script -->
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                // Smooth scroll for TOC links
                document.querySelectorAll('.toc-widget a[href^="#"]').forEach(anchor => {
                    anchor.addEventListener('click', function (e) {
                        e.preventDefault();
                        const target = document.querySelector(this.getAttribute('href'));
                        if (target) {
                            target.scrollIntoView({
                                behavior: 'smooth',
                                block: 'start'
                            });
                        }
                    });
                });
            });
        </script>
        
    </head>
